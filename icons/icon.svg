<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f2a"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
    <linearGradient id="brain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#4ecdc4"/>
      <stop offset="100%" stop-color="#ff6b8a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>
  <!-- Brain shape -->
  <g transform="translate(256, 256) scale(1.8)" fill="none" stroke="url(#brain)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left hemisphere -->
    <path d="M-10,-50 C-40,-50 -60,-30 -60,-5 C-60,10 -50,20 -50,35 C-50,50 -60,55 -45,60 C-30,65 -10,50 -10,30"/>
    <path d="M-55,-10 C-70,-5 -70,15 -55,20"/>
    <path d="M-10,-50 C-30,-45 -45,-30 -40,-10"/>
    <!-- Right hemisphere -->
    <path d="M10,-50 C40,-50 60,-30 60,-5 C60,10 50,20 50,35 C50,50 60,55 45,60 C30,65 10,50 10,30"/>
    <path d="M55,-10 C70,-5 70,15 55,20"/>
    <path d="M10,-50 C30,-45 45,-30 40,-10"/>
    <!-- Center -->
    <line x1="0" y1="-52" x2="0" y2="62"/>
    <!-- Neurons -->
    <circle cx="-30" cy="-25" r="3" fill="url(#brain)"/>
    <circle cx="30" cy="-25" r="3" fill="url(#brain)"/>
    <circle cx="-35" cy="20" r="3" fill="url(#brain)"/>
    <circle cx="35" cy="20" r="3" fill="url(#brain)"/>
    <circle cx="0" cy="0" r="4" fill="url(#brain)"/>
  </g>
  <!-- Sparkle dots -->
  <circle cx="120" cy="120" r="4" fill="#a78bfa" opacity="0.6"/>
  <circle cx="392" cy="140" r="3" fill="#4ecdc4" opacity="0.5"/>
  <circle cx="380" cy="380" r="4" fill="#ff6b8a" opacity="0.5"/>
  <circle cx="130" cy="370" r="3" fill="#fbbf24" opacity="0.5"/>
</svg>
